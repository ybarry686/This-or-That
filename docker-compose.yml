services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: this_or_that
      POSTGRES_PASSWORD: this_or_that
      POSTGRES_DB: this_or_that
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U this_or_that -d this_or_that"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://this_or_that:this_or_that@postgres:5432/this_or_that
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
